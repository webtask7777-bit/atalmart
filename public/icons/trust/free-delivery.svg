<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" shape-rendering="geometricPrecision" role="img" aria-labelledby="free-delivery-title">
  <title id="free-delivery-title">Free delivery above 299 rupees</title>
  <style>
      .delivery-truck { transform-origin: 32px 37px; animation: delivery-drive 3.4s cubic-bezier(.2,.7,.3,1) infinite; }
      .delivery-wheel { transform-box: fill-box; transform-origin: center; animation: delivery-wheel 3.4s ease-in-out infinite; }
      .delivery-road { stroke-dasharray: 6 5; animation: delivery-road 3.4s linear infinite; }
      .delivery-spark { transform-origin: 49px 15px; animation: delivery-spark 3.4s ease-in-out infinite; }
      @keyframes delivery-drive {
        0%, 8%, 34%, 100% { transform: translateX(0) translateY(0); }
        16% { transform: translateX(2px) translateY(-1px); }
        25% { transform: translateX(-1px) translateY(0); }
      }
      @keyframes delivery-wheel {
        0%, 8% { transform: rotate(0deg); }
        30%, 100% { transform: rotate(360deg); }
      }
      @keyframes delivery-road {
        0%, 8% { stroke-dashoffset: 0; }
        30%, 100% { stroke-dashoffset: -22; }
      }
      @keyframes delivery-spark {
        0%, 8%, 35%, 100% { opacity: .35; transform: scale(.75); }
        19% { opacity: 1; transform: scale(1.15); }
      }
    
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
      }
</style>
  
      <path class="delivery-road" d="M5 53h54" stroke="#FF6B00" stroke-width="2.5" stroke-linecap="round"/>
      <g class="delivery-truck" stroke="#0F5C3A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 20h30v26H8z" fill="#FFF4E8"/>
        <path d="M38 29h10l8 9v8H38z" fill="#FFFFFF"/>
        <path d="M43 29v10h12"/>
        <rect x="14" y="26" width="16" height="13" rx="2" fill="#FF6B00"/>
        <path d="M22 26v13M14 31h16" stroke="#FFFFFF" stroke-width="2"/>
        <g class="delivery-wheel">
          <circle cx="18" cy="47" r="6" fill="#FFFFFF"/>
          <path d="M18 44v6M15 47h6" stroke="#FF6B00" stroke-width="2"/>
        </g>
        <g class="delivery-wheel">
          <circle cx="47" cy="47" r="6" fill="#FFFFFF"/>
          <path d="M47 44v6M44 47h6" stroke="#FF6B00" stroke-width="2"/>
        </g>
      </g>
      <path class="delivery-spark" d="M49 8v14M42 15h14" stroke="#FF6B00" stroke-width="3" stroke-linecap="round"/>
    
</svg>
